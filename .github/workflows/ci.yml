# gaige CI — the no-GPU path, on every platform a user might actually have.
#
# Scope is deliberate: this runs the parts that need nothing but numpy. Detector runs need a
# GPU and a pinned model environment, so they are verified on the reference host and recorded
# in receipts, not here. What CI guarantees is that the CALIBRATION and REPORTING layer — the
# part that turns scores into numbers people act on — is correct and portable.
#
# Windows is in the matrix on purpose. A report-writing bug that only surfaced on Windows
# (default cp1252 encoding vs a non-ASCII character in report.md) shipped unnoticed once;
# this matrix is what catches that class of defect.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (core only — no torch, proving the GPU-free path)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Assert the core imports without any GPU stack
        # If a torch/bitsandbytes import ever escapes to module scope, gaige silently stops
        # working on every machine without CUDA. Fail loudly here instead of at a user's prompt.
        run: |
          python -c "import gaige, gaige.calibrate, gaige.conformal, gaige.subgroups, gaige.corpus, gaige.receipts, gaige.analyze, gaige.cli; print('core imports clean')"
          python -c "import sys; assert 'torch' not in sys.modules, 'torch leaked into module scope'; print('no torch at import time')"

      - name: CLI smoke
        run: |
          python -m gaige.cli --version
          python -m gaige.cli corpora
          python -m gaige.cli analyze --help

      - name: Identity drift check
        # gaige catches instruments that quietly stopped measuring the same thing; this points
        # the same check at gaige itself (version/header/description/docs/import hygiene).
        run: python tools/check_consistency.py

      - name: Tests
        run: python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: ruff check
        run: ruff check gaige/ tests/
      - name: ruff format --check
        run: ruff format --check gaige/ tests/
