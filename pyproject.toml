[project]
name = "detcal"
version = "0.0.1"
description = "Calibration + receipts harness for AI-text detectors: your corpus, your thresholds, honest error bars."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "ghxrk13" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
# GPU detectors expect these in the environment; versions are recorded in every receipt.
# transformers pinned <5: 5.14.1 measured (2026-07-21) silently ignoring 4-bit config
# (eetq misroute -> fp16 load). See PROGRESS.md incident receipt.
gpu = ["torch", "transformers>=4.45,<5", "bitsandbytes", "accelerate"]

[project.scripts]
detcal = "detcal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["detcal*"]
